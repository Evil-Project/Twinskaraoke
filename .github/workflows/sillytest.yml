name: silly test workflow

on:
  push:
    branches:
      - sillybackgroundtest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Force Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      # ------------------------

      - name: Archive iPhone
        run: |
          xcodebuild archive \
            -project Twinskaraoke.xcodeproj \
            -scheme "Twinskaraoke" \
            -archivePath build/iPhone.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Sideload-Friendly iPhone IPA
        run: |
          mkdir -p Payload
          cp -R build/iPhone.xcarchive/Products/Applications/*.app Payload/
          
          # --- sideload fix ---
          rm -rf Payload/*.app/Watch
          # ---------------------
          
          zip -q -r Twinskaraoke-iPhone-Sideload.ipa Payload
          mkdir -p output && mv Twinskaraoke-iPhone-Sideload.ipa output/

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v7
        with:
          name: Twinskaraoke-iPhone
          path: output/Twinskaraoke-iPhone-Sideload.ipa

      - name: Archive Watch
        run: |
          xcodebuild archive \
            -project Twinskaraoke.xcodeproj \
            -scheme "TwinskaraokeWatchApp" \
            -archivePath build/Watch.xcarchive \
            -destination "generic/platform=watchOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Watch IPA
        run: |
          rm -rf Payload
          mkdir -p Payload_Watch
          cp -R build/Watch.xcarchive/Products/Applications/*.app Payload_Watch/
          mv Payload_Watch Payload
          zip -q -r Twinskaraoke-Watch.ipa Payload
          mkdir -p output_watch && mv Twinskaraoke-Watch.ipa output_watch/

      - name: Upload Watch IPA
        uses: actions/upload-artifact@v7
        with:
          name: Twinskaraoke-Watch
          path: output_watch/Twinskaraoke-Watch.ipa

      # --- SILLY TEST RELEASE ---
      
      - name: Update "sillytest" Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f sillytest
          git push -f origin sillytest

      - name: Publish Silly Test Release
        uses: ncipollo/release-action@v1
        with:
          tag: sillytest
          name: "Silly Test Build DON'T DL IF YOU ARE SEEING THIS!"
          body: "This is an test build containing the latest changes. It automatically rebuilds and overwrites this release every time new code is pushed to the `sillybackgroundtest` branch."
          artifacts: "output/Twinskaraoke-iPhone-Sideload.ipa,output_watch/Twinskaraoke-Watch.ipa"
          allowUpdates: true
          prerelease: true
          replacesArtifacts: true
