name: Analyze

on:
  pull_request:
  workflow_dispatch:
    inputs:
      xcode-version:
        description: Xcode version to audit (use a specific installed version for SDK previews)
        default: latest
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.scheme }}
    runs-on: xcode-27  # GitHub's Xcode 27 image (macOS 27)
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Twinskaraoke
            destination: generic/platform=iOS Simulator
          - scheme: Twinskaraoke Mac App
            destination: platform=macOS
          - scheme: Twinskaraoke TV App
            destination: generic/platform=tvOS Simulator
          - scheme: TwinskaraokeWatchApp
            destination: generic/platform=watchOS Simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || 'latest' }}
      - name: Record SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build and analyze
        env:
          SCHEME: ${{ matrix.scheme }}
          DESTINATION: ${{ matrix.destination }}
        run: |
          xcodebuild build analyze \
            -project Twinskaraoke.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/analysis.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-${{ matrix.scheme }}
          path: ${{ runner.temp }}/analysis.xcresult
          if-no-files-found: warn
