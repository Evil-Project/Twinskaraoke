name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  ios-tests:
    name: iOS Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Force Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run iOS Tests
        run: |
          # Name-only destinations imply OS:latest; a device that only exists
          # under an older runtime then fails to match. Resolve the UDID from
          # the newest runtime that actually has an iPhone and target that.
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            devices.keys.sort.reverse_each do |runtime|
              match = devices[runtime].find { |d| d["isAvailable"] && d["name"].start_with?("iPhone") }
              if match
                puts match["udid"]
                break
              end
            end
          ')
          test -n "$udid"
          echo "Using simulator UDID: $udid"
          # Wait for a usable simulator before launching the test host. Keep
          # one worker below so Xcode uses this booted device, not cold clones.
          xcrun simctl bootstatus "$udid" -b
          # -skipPackagePluginValidation: Pillarbox ships PillarboxPackageInfoPlugin,
          # an SPM build tool plugin, and Xcode will not run a plugin that has not
          # been trusted. Trust is normally granted through a prompt in the GUI,
          # which a runner has no way to answer, so every build since Pillarbox
          # arrived died on "must be enabled before it can be used".
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -skipPackagePluginValidation \
            -scheme "Twinskaraoke" \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:TwinskaraokeTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-diagnostics
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ~/Library/Logs/DiagnosticReports
            ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter
          if-no-files-found: warn

  watch-tests:
    name: watchOS Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Force Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run watchOS Tests
        run: |
          # Same UDID-based resolution as the iOS job (see above).
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            devices.keys.sort.reverse_each do |runtime|
              match = devices[runtime].find { |d| d["isAvailable"] && d["name"].start_with?("Apple Watch") }
              if match
                puts match["udid"]
                break
              end
            end
          ')
          echo "Using simulator UDID: $udid"
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -skipPackagePluginValidation \
            -scheme "TwinskaraokeWatchApp" \
            -destination "platform=watchOS Simulator,id=$udid" \
            -only-testing:'Twinskaraoke Watch AppTests' \
            CODE_SIGNING_ALLOWED=NO
