name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  ios-tests:
    name: iOS Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Force Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run iOS Tests
        run: |
          device=$(xcrun simctl list devices available -j | ruby -rjson -e 'puts JSON.parse(STDIN.read)["devices"].values.flatten.reverse.find { |d| d["name"].start_with?("iPhone") }["name"]')
          echo "Using simulator: $device"
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -scheme "Twinskaraoke" \
            -destination "platform=iOS Simulator,name=$device" \
            -only-testing:TwinskaraokeTests \
            CODE_SIGNING_ALLOWED=NO

  watch-tests:
    name: watchOS Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Force Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Run watchOS Tests
        run: |
          device=$(xcrun simctl list devices available -j | ruby -rjson -e 'puts JSON.parse(STDIN.read)["devices"].values.flatten.reverse.find { |d| d["name"].start_with?("Apple Watch") }["name"]')
          echo "Using simulator: $device"
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -scheme "TwinskaraokeWatchApp" \
            -destination "platform=watchOS Simulator,name=$device" \
            -only-testing:'Twinskaraoke Watch AppTests' \
            CODE_SIGNING_ALLOWED=NO
