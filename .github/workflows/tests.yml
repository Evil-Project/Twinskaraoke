name: Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      xcode-version:
        description: Xcode version to test
        default: latest
        type: string

permissions:
  contents: read

# Every job runs on GitHub's Xcode 27 image (macOS 27) and tests on the newest
# iOS / watchOS 27 simulator runtime installed there. Bump these together
# with the runs-on labels when moving to the next major version.
env:
  IOS_MAJOR: "27"
  WATCHOS_MAJOR: "27"

jobs:
  ios-tests:
    name: iOS Tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || 'latest' }}

      - name: Run iOS Tests
        run: |
          # Newest iOS $IOS_MAJOR.x iPhone simulator; see Scripts/ci-simulator.sh.
          udid=$(Scripts/ci-simulator.sh iOS "$IOS_MAJOR" iPhone)
          test -n "$udid"
          echo "Using simulator UDID: $udid"
          # Wait for a usable simulator before launching the test host. Keep
          # one worker below so Xcode uses this booted device, not cold clones.
          xcrun simctl bootstatus "$udid" -b
          # -skipPackagePluginValidation: Pillarbox ships PillarboxPackageInfoPlugin,
          # an SPM build tool plugin, and Xcode will not run a plugin that has not
          # been trusted. Trust is normally granted through a prompt in the GUI,
          # which a runner has no way to answer, so every build since Pillarbox
          # arrived died on "must be enabled before it can be used".
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -skipPackagePluginValidation \
            -scheme "Twinskaraoke" \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:TwinskaraokeTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-diagnostics
          path: |
            ${{ runner.temp }}/ios-tests.xcresult
            ~/Library/Logs/DiagnosticReports
            ~/Library/Developer/CoreSimulator/Devices/*/data/Library/Logs/CrashReporter
          if-no-files-found: warn

  watch-tests:
    name: watchOS Tests
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || 'latest' }}

      - name: Run watchOS Tests
        run: |
          udid=$(Scripts/ci-simulator.sh watchOS "$WATCHOS_MAJOR" "Apple Watch")
          echo "Using simulator UDID: $udid"
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -skipPackagePluginValidation \
            -scheme "TwinskaraokeWatchApp" \
            -destination "platform=watchOS Simulator,id=$udid" \
            -only-testing:'Twinskaraoke Watch AppTests' \
            CODE_SIGNING_ALLOWED=NO

  ios-ui-smoke:
    name: iOS UI Smoke Tests
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || 'latest' }}

      - name: Run navigation and playback UI tests
        run: |
          # Smoke set: app launch, adaptive shell, drill-down navigation,
          # playback gestures, session restore and settings persistence.
          set -o pipefail
          udid=$(Scripts/ci-simulator.sh iOS "$IOS_MAJOR" iPhone)
          test -n "$udid"
          echo "Using simulator UDID: $udid"
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project Twinskaraoke.xcodeproj \
            -skipPackagePluginValidation \
            -scheme "Twinskaraoke" \
            -destination "platform=iOS Simulator,id=$udid" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testAppLaunches \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testAdaptiveMusicShellShowsSidebarOrTabs \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testLibraryAndSearchDrillDownNavigation \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testSwipingBackFromPlaylistDetailStartsNoPlayback \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testNativePlaybackSliderDoesNotDismissPlayer \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testPlaybackSessionRestoresPausedAfterRelaunch \
            -only-testing:TwinskaraokeUITests/TwinskaraokeUITests/testSettingsPersistAutoplayAndEnforceTransitionChoice \
            -resultBundlePath "$RUNNER_TEMP/ios-ui-smoke.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-smoke
          path: ${{ runner.temp }}/ios-ui-smoke.xcresult
          if-no-files-found: warn
